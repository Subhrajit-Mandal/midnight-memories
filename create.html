<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Create Memory ❤️</title>

  <style>

    body {

      margin: 0;
      font-family: Arial, sans-serif;

      background: #fff0f5;

      color: #ff4f7a;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;

    }

    .card {

      background: white;

      padding: 40px;

      border-radius: 25px;

      width: 90%;
      max-width: 600px;

      box-shadow:
      0 10px 30px rgba(0,0,0,0.1);

    }

    .signature {

        position: fixed;

        bottom: 15px;

        left: 20px;

        font-size: 14px;

        color: #c77d92;

        opacity: 0.8;

        letter-spacing: 1px;

        z-index: 999;

    }

    h1 {

      text-align: center;
      margin-bottom: 30px;

    }

    input,
    textarea {

      width: 100%;

      padding: 15px;

      margin-top: 15px;

      border-radius: 15px;

      border: 1px solid #ddd;

      font-size: 16px;

      box-sizing: border-box;

    }

    textarea {

      resize: vertical;
      min-height: 120px;

    }

    button {

      width: 100%;

      margin-top: 25px;

      padding: 18px;

      border: none;

      border-radius: 20px;

      background: #ff4f7a;

      color: white;

      font-size: 18px;

      cursor: pointer;

    }

    button:hover {

      opacity: 0.9;

    }

    #result {

      margin-top: 30px;

      text-align: center;

      word-break: break-word;

    }

    a {

      color: #ff4f7a;

      font-weight: bold;

    }

  </style>

</head>

<body>

  <div class="card">

    <h1>Create Your Memory ❤️</h1>

    <input
      type="text"
      id="sender"
      placeholder="Your Name">

    <input
      type="text"
      id="receiver"
      placeholder="Loved One's Name">

    <textarea
      id="message"
      placeholder="Write your heartfelt message..."></textarea>

    <textarea
      id="popup"
      placeholder="Popup message when YES is pressed..."></textarea>

    <textarea
      id="images"
      placeholder="Paste image URLs separated by commas"></textarea>

    <button onclick="generateMemory()">

      Generate Memory Link ✨

    </button>

    <div id="result"></div>

  </div>

  <script>

    const API_URL =
    "https://script.google.com/macros/s/AKfycbxtb59g9IfPs6-jYE6obkxtZPGqA5vIMpj-Zovc4Yw0QH_aFrmNgmX8FBe-IEKJPt_KyA/exec";



    async function generateMemory() {

      const sender =
      document.getElementById("sender").value;

      const receiver =
      document.getElementById("receiver").value;

      const message =
      document.getElementById("message").value;

      const popup =
      document.getElementById("popup").value;

      const images =
      document.getElementById("images").value;



      // RANDOM ID

      const id =
      Math.random()
      .toString(36)
      .substring(2,8);



      const payload = {

        id,
        sender,
        receiver,
        message,
        popup,
        images

      };



      try {

        await fetch(API_URL, {

          method: "POST",

          mode: "no-cors",

          headers: {

            "Content-Type":
            "application/json"

          },

          body:
          JSON.stringify(payload)

        });



        // GENERATE LINK

        const link =

`https://midnight-memoirs.netlify.app/LoveBot.html?id=${id}`;



        document.getElementById(
          "result"
        ).innerHTML = `

          <h3>
            Your Memory Link 🌸
          </h3>

          <a href="${link}" target="_blank">
            ${link}
          </a>

        `;

      }

      catch(error) {

        console.error(error);

        alert(
          "Something went wrong 😢"
        );

      }

    }

  </script>
  <div class="signature">

  Crafted with ❤️ by Subhrajit Mandal

</div>

</body>

</html>
